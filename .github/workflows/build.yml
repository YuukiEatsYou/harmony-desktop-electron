name: Build

# Runs on a manual click in the Actions tab, and on every v* tag. Tag pushes
# also publish a GitHub Release with the installers attached. Windows installers
# need Wine when cross-built from Linux, and macOS installers can only be built
# on macOS, so each platform runs on its own native runner.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Required so the release job may create a release and upload assets.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
          - name: Windows
            os: windows-latest
            script: dist:win
            artifacts: |
              release/*.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            artifacts: |
              release/*.dmg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npm run ${{ matrix.script }}
        env:
          # No signing certificates are configured, so stop electron-builder
          # from hunting for one (which fails on macOS runners).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Keep the installers as run artifacts too, so a manual (untagged) run
      # still produces downloadable files.
      - uses: actions/upload-artifact@v7
        with:
          name: harmony-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # Only on a tag push; a manual run stops after building.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Gather every platform's installers into one directory.
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          generate_release_notes: true
