<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: harmony-icon:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harmony</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <nav id="server-rail" aria-label="Servers">
        <ul id="server-list"></ul>
        <button id="add-server" class="rail-button rail-add" title="Add a server" aria-label="Add a server">
          +
        </button>
      </nav>

      <main id="content">
        <div id="webview-host"></div>

        <section id="empty-state">
          <h1 id="empty-title">No servers yet</h1>
          <p id="empty-copy" class="dim">Add a Harmony server to get started.</p>
          <button id="empty-add" class="primary-button">Add a server</button>
        </section>

        <section id="load-error" hidden>
          <h1 id="load-error-name"></h1>
          <p id="load-error-message" class="dim"></p>
          <button id="load-error-retry" class="primary-button">Retry</button>
        </section>
      </main>
    </div>

    <div id="dialog-backdrop" class="dialog-backdrop" hidden>
      <form id="add-form" class="dialog">
        <h2>Add a server</h2>
        <label for="server-url">Server address</label>
        <input
          id="server-url"
          name="url"
          type="text"
          placeholder="chat.example.com"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="dialog-error" class="dialog-error" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel" class="ghost-button">Cancel</button>
          <button type="submit" class="primary-button">Add</button>
        </div>
      </form>
    </div>

    <script src="shell.js"></script>
  </body>
</html>
